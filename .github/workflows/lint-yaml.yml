---
# --------------------------------

name: "yamllint-action"
on:  # yamllint disable-line rule:truthy
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  yamllint:
    name: yamllint-job
    runs-on: ubuntu-latest
    steps:
    - name: "Checkout"
      uses: actions/checkout@v7
    - name: "Setup uv"
      uses: astral-sh/setup-uv@v10.2.0
    - name: "Install tools"
      run: uv sync --locked --no-install-project
    - name: "yamllint-lint"
      run: uv run --no-sync yamllint --strict --config-file=.config/yamllint .

